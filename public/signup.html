<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign up — WhatsApp Support Portal</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="sub">Connect WhatsApp + Jira and turn messages into tickets.</p>
    <form id="form">
      <label>Name<input name="display_name" type="text" placeholder="Your name" /></label>
      <label>Email<input name="email" type="email" required placeholder="you@company.com" /></label>
      <label>Password<input name="password" type="password" required minlength="8" placeholder="8+ characters" /></label>
      <button type="submit">Sign up</button>
    </form>
    <p id="msg" class="msg"></p>
    <p class="alt">Already have an account? <a href="/login.html">Log in</a></p>
  </div>
  <script>
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      msg.textContent = "";
      const fd = new FormData(e.target);
      const body = Object.fromEntries(fd.entries());
      const res = await fetch("/auth/signup", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
      });
      const data = await res.json();
      if (res.ok) { location.href = "/dashboard.html"; }
      else { msg.textContent = data.detail || data.error || "Signup failed"; msg.className = "msg err"; }
    });
  </script>
</body>
</html>
